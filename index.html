      <section class="selected-work" id="work" aria-label="Selected work">
        <div class="project-grid">
          <a

            data-case-study
            aria-label="View case study: Government support and youth labor supply in Mexico"

            <div class="project-cover project-cover-stata">
              <figure class="stata-main-window">
                <img
                  src="assets/projects/enoe/stata-main-results.png"
                  alt="Stata results window showing marginal-effect estimates from the ENOE analysis."
                />
              </figure>

              <figure class="stata-graph-window stata-graph-overlap">
                <figcaption>Graph · Propensity-score overlap</figcaption>
                <img
                  src="assets/projects/enoe/04_propensity_overlap.svg"
                  alt="Propensity-score overlap between students receiving and not receiving government support."
                />
              </figure>

              <figure class="stata-graph-window stata-graph-age">
                <figcaption>Graph · Effects by age</figcaption>
                <img
                  src="assets/projects/enoe/02_cover_age_heterogeneity.svg"
                  alt="Estimated effects on weekly working hours by age."
                />
              </figure>
            </div>

            <div class="project-card-copy">
              <h3>Government support and youth labor supply in Mexico</h3>
              <p class="project-meta">Econometrics · ENOE · Causal inference · Stata</p>
            </div>
          </a>
        </div>
